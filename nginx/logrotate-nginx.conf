# ─────────────────────────────
# Access logs (monthly, persistent filenames)
# ─────────────────────────────
/var/log/nginx/*/access_log.* {
    monthly
    missingok
    notifempty
    sharedscripts
    postrotate
        nginx -s reopen
    endscript
}

# ─────────────────────────────
# Error logs (classic rotation)
# ─────────────────────────────
/var/log/nginx/*/error.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 nginx adm
    sharedscripts
    postrotate
        nginx -s reopen
    endscript
}

