<div class="font-semibold text-xl mb-4">
  Learning Terms and Conditions and acceptance of Privacy Policy
</div>
<div class="flex items-center mb-4">
  @if (locked) {
    <p-checkbox
      id="consentCheck"
      [(ngModel)]="consentedTo"
      [binary]="true"
      (onChange)="onChange()"
      [disabled]="true"
    />
  } @else {
    <p-checkbox
      id="consentCheck"
      [(ngModel)]="consentedTo"
      [binary]="true"
      (onChange)="onChange()"
    />
  }
  <label for="consentCheck" class="text-lg pl-2"
    >I have read and consented to the <a routerLink="/terms">Terms and Conditions</a> and
    <a routerLink="/privacy">Privacy Policy</a></label
  >
</div>
