<div class="card">
  <div class="font-semibold text-2xl mb-4">
    Learning "Terms and Conditions" and content to "Privacy Policy"
  </div>
  <div class="flex items-center mb-4">
    <p-checkbox
      id="consentCheck"
      [ngModel]="consentedTo()"
      [binary]="true"
      [disabled]="locked()"
      (onChange)="onChange()"
    />
    <label for="consentCheck" class="font-semibold text-xl italic pl-2"
      >I have read
      <a routerLink="/terms" queryParamsHandling="preserve">Terms and Conditions</a> and
      <a routerLink="/privacy" queryParamsHandling="preserve">Privacy Policy</a> and agreed to
      them.</label
    >
  </div>
  @if (consentError()) {
    <p class="text-red-600 font-medium" role="alert">
      <i class="pi pi-times-circle mr-2"></i>{{ consentError() }}
    </p>
  }
</div>
