<div class="max-w-2xl mx-auto p-4">
  @if (status() === 'checking') {
    <p class="text-surface-500"><i class="pi pi-spin pi-spinner mr-2"></i>Signing you in…</p>
  } @else {
    <p-message severity="error" styleClass="w-full" [closable]="false">
      This sign-in link is invalid or has expired.
    </p-message>
    <p class="mt-3"><a class="underline" routerLink="/login">Request a new link</a></p>
  }
</div>
