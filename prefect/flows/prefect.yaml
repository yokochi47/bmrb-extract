# Prefect deployment for the NMR conversion flow.
#
# Registered with the Prefect server by setup.sh (and re-runnable any time):
#   docker compose exec prefect-worker sh -c "cd /flows && prefect deploy --all"
#
# The flow runs in-place on the worker (process pool): the pull step just sets
# the working directory to /flows (the ./prefect/flows mount), so the entrypoint
# core/process_session.py resolves with __file__ at /flows/core/... — keeping the
# flow's relative sys.path inserts (workspace, ../shared/core) valid. No remote
# code storage / temp checkout.

deployments:
  - name: default
    entrypoint: core/process_session.py:process_session
    work_pool:
      name: local-pool
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /flows

  # Refreshes /workspace/versions.json from the live maxit-ccd / py-wwpdb_utils_nmr
  # images (docker inspect) so the footer reflects the currently-deployed versions.
  # Scheduled every 10 min; also seeded once by start.sh and refreshed at the end
  # of each conversion run. Deployment: capture-versions/default.
  - name: default
    entrypoint: core/versions.py:capture_versions_flow
    work_pool:
      name: local-pool
    schedules:
      - interval: 600
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /flows

  # Enforces the data-retention policy (T&C #8): nightly at 02:00 local site
  # time, expires sessions past session.token_expiry — deletes their archive +
  # workspace, purges child rows, marks the session 'expired', and emails the
  # admin a summary. Timezone is the worker's TZ (Asia/Tokyo / US/Eastern).
  # Deployment: cleanup-sessions/default.
  - name: default
    entrypoint: core/cleanup.py:cleanup_sessions_flow
    work_pool:
      name: local-pool
    schedules:
      - cron: "0 2 * * *"
        timezone: "{{ $TZ }}"
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /flows

  # Cross-site data exchange (Osaka <-> UConn): every 6 hours pulls the PEER
  # site's valid sessions (DB rows + archive + workspace) over SSH/rsync and
  # merges them into the local DB for troubleshooting. No-ops while PEER_HOST is
  # empty. Timezone is the worker's TZ. Deployment: exchange-sessions/default.
  - name: default
    entrypoint: core/exchange.py:exchange_sessions_flow
    work_pool:
      name: local-pool
    schedules:
      - cron: "0 */6 * * *"
        timezone: "{{ $TZ }}"
    pull:
      - prefect.deployments.steps.set_working_directory:
          directory: /flows
