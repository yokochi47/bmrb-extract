# bmrb_extract kernel tunables, applied at boot by systemd-sysctl.service.
#
# setup.sh sets these with `sudo sysctl -w` when they are below target; persisting
# them here means the boot-time run of setup.sh finds them already satisfied and
# needs no sudo for them.
#
# Installed to /etc/sysctl.d/99-bmrb-extract.conf by ./install_systemd.sh.

# HTTP/3 (QUIC) UDP buffers — keep in sync with net_core_mem_max in setup.sh
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000

# Redis background-save reliability
vm.overcommit_memory = 1
